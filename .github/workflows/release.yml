# On every push to main: run the tests on Windows, build iPadDisplay.exe and publish
# dist/iPadDisplay-<version>-windows-x64.zip as a GitHub release (v<VERSION from server.py>).
# Bump VERSION in server.py to publish a new release; otherwise the current one is refreshed.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build the app
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' server.py)
          tag="v$version"
          zip="dist/iPadDisplay-$version-windows-x64.zip"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" --target "$GITHUB_SHA" --title "iPad Display $version" \
              --notes "Download iPadDisplay-$version-windows-x64.zip, unzip it and double-click Install.bat. See the README for the one-time setup."
          fi
